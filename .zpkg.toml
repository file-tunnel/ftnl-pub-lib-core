[package]
org = "file-tunnel"
name = "ftnl-pub-lib-core"
version = "0.1.0"
description = "Frontend-safe runtime policy and configuration for File Tunnel clients"
license = "MIT"
keywords = ["configuration", "file-transfer", "frontend", "rust", "security"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/file-tunnel/ftnl-pub-lib-core"

[dependencies]
"file-tunnel/ftnl-interfaces" = "^0.1.0"

[build]
command = "cargo build --release --locked"
outputs = ["target/release/libftnl_pub_lib_core.rlib"]

[install]
adapter = "rust"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "cargo test --locked --manifest-path \"$ZED_PKG_TEST_TARGET/Cargo.toml\""
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo test --all-targets --locked"
